name: Discord Forum Notification
on:
  push:
    branches: [ "main" ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Discord Webhook Notify
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: info
          username: GitHub Bot
          color: '#34a853'
          avatarUrl: https://githubassets.com
          details: '🔨 새 커밋이 푸시되었습니다!'
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
          threadId: ${{ secrets.DISCORD_THREAD_ID }}
