name: Discord Notification

on:
  push:
    branches: [ "main" ] # 본인의 기본 브랜치 이름 (main 또는 master)

jobs:
  discord-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Discord Webhook Action
        uses: illo725/discord-webhook-action@v2.2.5
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
