name: Discord Forum Notification
on:
  push:
    branches: [ "main" ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Discord Webhook Notify
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: 여기다가정우님이준숫자ID입력
        with:
          args: '🔨 [${{ github.repository }}] 새 커밋이 푸시되었습니다! (작성자: ${{ github.actor }})'
