name: Discord Forum Notification
on:
  push:
    branches: [ "main" ]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        run: |
          # ⚠️ 뒤에 ?thread_id= 를 붙이지 않고, secrets 금고에서 주소를 그대로 가져옵니다.
          TARGET_URL="${{ secrets.DISCORD_WEBHOOK_URL }}"
          
          # 포럼 스레드에 정상적으로 꽂히도록 JSON 데이터를 구성합니다.
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [
              {
                "title": "🔨 새 커밋 알림 - ${{ github.repository }}",
                "description": "**작성자:** ${{ github.actor }}\n**브랜치:** ${{ github.ref_name }}\n**메시지:** ${{ github.event.head_commit.message }}",
                "color": 3447003
              }
            ]
          }
          EOF
          )
          
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$TARGET_URL"
