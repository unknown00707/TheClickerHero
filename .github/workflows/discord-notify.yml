name: Discord Notification

on:
  push:
    branches: [ "main" ]

jobs:
  discord-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Send GitHub Style Discord Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 웹훅 URL 뒤에 /github를 붙이면 디스코드에서 자동으로 GitHub 공식 포맷(GitHub 앱 레이블)으로 변환해줍니다.
          curl -X POST -H "Content-Type: application/json" "${WEBHOOK_URL}/github"
